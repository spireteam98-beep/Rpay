<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Wayaki — your crypto wallet, mobile money and virtual bank account in one app.">
  <!--
    No viewport meta previously — mobile browsers (and Telegram's in-app
    WebView) default to desktop-page zoom heuristics without it, which reads
    as janky pinch/double-tap-zoom on what's meant to feel like a native
    app. viewport-fit=cover also lets safe-area-inset-* CSS env vars work,
    for devices with a notch/home-indicator.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wayaki">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <title>Wayaki</title>
  <link rel="manifest" href="manifest.json">

  <!-- Required by flutter_stripe_web to render CardField/Stripe Elements -->
  <script src="https://js.stripe.com/v3/"></script>

  <!--
    Telegram Mini Apps SDK. Always loaded (harmless outside Telegram — it
    just defines window.Telegram.WebApp with an empty initData) so the same
    web build works standalone and as a Telegram Mini App.
    https://core.telegram.org/bots/webapps
  -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <style>
    /* Stops the browser's own pull-to-refresh / rubber-band bounce from
       showing through — inside Telegram's WebView that reads as "this is
       just a webpage", not a native-feeling app. */
    html, body {
      overscroll-behavior: none;
      background: #050506;
    }

    /* Flutter's engine (download + parse + first paint) takes a beat,
       especially on a cold mobile connection inside Telegram. Without this,
       that gap is a blank white flash before Wayaki's own dark UI appears.
       Removed automatically once Flutter fires 'flutter-first-frame'. */
    #wayaki-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050506;
      transition: opacity 200ms ease;
    }
    #wayaki-boot-splash.wayaki-boot-splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #wayaki-boot-splash .wayaki-boot-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(221, 247, 22, 0.18);
      border-top-color: #DDF716;
      animation: wayaki-boot-spin 0.8s linear infinite;
    }
    @keyframes wayaki-boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <div id="wayaki-boot-splash"><div class="wayaki-boot-spinner"></div></div>

  <script>
    // Older Flutter service workers can keep serving an obsolete payment UI
    // after a production deployment. This app is network-backed and should
    // always load the current bundle, so remove legacy workers once and
    // reload any page that was still controlled by one.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        const registrations = await navigator.serviceWorker.getRegistrations();
        const wasControlled = Boolean(navigator.serviceWorker.controller);
        await Promise.all(registrations.map((registration) => registration.unregister()));
        if (wasControlled && !sessionStorage.getItem('wayaki-sw-reset-20260725')) {
          sessionStorage.setItem('wayaki-sw-reset-20260725', '1');
          window.location.reload();
        }
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('wayaki-boot-splash');
      if (!splash) return;
      splash.classList.add('wayaki-boot-splash-hidden');
      setTimeout(function () { splash.remove(); }, 250);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
