<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Wayaki — your crypto wallet, mobile money and virtual bank account in one app.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wayaki">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <title>Wayaki</title>
  <link rel="manifest" href="manifest.json">

  <!-- Required by flutter_stripe_web to render CardField/Stripe Elements -->
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <script>
    // Older Flutter service workers can keep serving an obsolete payment UI
    // after a production deployment. This app is network-backed and should
    // always load the current bundle, so remove legacy workers once and
    // reload any page that was still controlled by one.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        const registrations = await navigator.serviceWorker.getRegistrations();
        const wasControlled = Boolean(navigator.serviceWorker.controller);
        await Promise.all(registrations.map((registration) => registration.unregister()));
        if (wasControlled && !sessionStorage.getItem('wayaki-sw-reset-20260725')) {
          sessionStorage.setItem('wayaki-sw-reset-20260725', '1');
          window.location.reload();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
